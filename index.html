<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Időjárás</title>
    <style>
        
body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
    min-height: 100vh;
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    
    
}

.kozipre {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    max-width: 450px; 
    padding: 20px;
    

}


.search-container {
    position: relative;
    width: 100%;
    margin-bottom: 25px;
    
}

.search-container input {
    width: 105%  ;
    box-sizing: border-box;
    padding: 14px 45px 14px 20px;
    font-size: 40px;
    border: none;
    border-radius: 30px;
    background: rgba(255, 255, 255, 0.9);
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
    outline: none;
    transition: all 0.3s ease;
}

.search-container input:focus {
    background: #ffffff;
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
}

.search-container img {
    position: absolute;
    right: 2px;
    top: 50%;
    transform: translateY(-50%);
    
    height: 50px;
    opacity: 0.6;
    pointer-events: none;
}


#suggestions {
    position: absolute;
    top: 110%;
    left: 0;
    width: 100%;
    background: #ffffff;
    border-radius: 16px;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
    overflow: hidden;
    z-index: 10;
}

.suggestion-item {
    padding: 12px 20px;
    font-size: 15px;
    color: #333;
    cursor: pointer;
    transition: background 0.2s;
    border-bottom: 1px solid #f0f0f0;
}

.suggestion-item:last-child {
    border-bottom: none;
}

.suggestion-item:hover {
    background-color: #f5f7fa;
}


.weather-card {
    margin-left:5%;
    width: 105%;
    box-sizing: border-box;
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(10px); 
    border-radius: 24px;
    padding: 30px 25px;
    text-align: center;
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
}

.weather-card h2 {
    margin: 0;
    font-size: 26px;
    color: #2c3e50;
    font-weight: 600;
}

.temp-box {
    font-size: 52px;
    font-weight: 700;
    color: #1a1a1a;
    margin: 17px 0 25px 0;
}

.details {
    display: flex;
    justify-content: space-around;
    background: rgba(255, 255, 255, 0.6);
    padding: 15px;
    border-radius: 16px;
}

.details p {
    margin: 0;
    font-size: 14px;
    color: #555;
    font-weight: 500;
}

.details span {
    font-weight: 700;
    color: #222;
}
    </style>
</head>
<body>
    

<div class="kozipre">

    <div class="search-container">
        <input type="text" id="cityInput" placeholder="Város neve...">
        <img src="./img/kereses.webp" alt="kereses">
        <div id="suggestions"></div>
    </div>

    <div id="weatherCard" class="weather-card">
        <h2 id="cityName">--</h2>
        <div class="temp-box">
            <span id="temperature">--</span> °C
        </div>
        <div class="details">
            <p>Páratartalom: <span id="humidity">--</span>%</p>
            <p>Szélsebesség: <span id="windSpeed">--</span> km/h</p>
        </div>
    </div>

</div>

    <script src="./js/autocorrect.js"></script>
    <script src="./js/idojaras.js"></script>
</body>
</html>
